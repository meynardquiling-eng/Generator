<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Training Drill Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: a work desk. Top bar with sections; one working column; drill IDs set in mono as the join key everywhere. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --sunk: #eceff4;
  --ink: #18202c;
  --muted: #586374;
  --line: #d9dee7;
  --accent: #2c4bc9;
  --accent-soft: #e4e9fb;
  --ok: #1d7748;
  --ok-soft: #e1f2e8;
  --warn: #9a5b00;
  --warn-soft: #fbefd9;
  --bad: #b3261e;
  --bad-soft: #fbe4e2;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-doc: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  --font-id: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141b; --surface: #171d26; --sunk: #1d2430; --ink: #e5e9f0; --muted: #9ba5b4; --line: #2b3442;
    --accent: #93a6ff; --accent-soft: #232c4a; --ok: #62c48f; --ok-soft: #173326; --warn: #e2a84a; --warn-soft: #3a2c14;
    --bad: #f2827a; --bad-soft: #3d1d1b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141b; --surface: #171d26; --sunk: #1d2430; --ink: #e5e9f0; --muted: #9ba5b4; --line: #2b3442;
  --accent: #93a6ff; --accent-soft: #232c4a; --ok: #62c48f; --ok-soft: #173326; --warn: #e2a84a; --warn-soft: #3a2c14;
  --bad: #f2827a; --bad-soft: #3d1d1b; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; }
a { color: var(--accent); }
h1, h2, h3 { text-wrap: balance; line-height: 1.25; margin: 0; }
h1 { font-size: 1.25rem; font-weight: 600; }
h2 { font-size: 1.1rem; font-weight: 600; }
h3 { font-size: 0.95rem; font-weight: 600; }
p { margin: 0; }
.mono { font-family: var(--font-id); font-size: 0.86em; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.label { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand small { color: var(--muted); }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
nav.tabs button, .subtabs button { border: 0; background: none; font: inherit; color: var(--muted); padding: 6px 10px; border-radius: var(--r); cursor: pointer; }
nav.tabs button[aria-current="page"], .subtabs button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav.tabs button:hover, .subtabs button:hover { color: var(--ink); }

main { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px; }
.stack { display: grid; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.spread { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel.flat { background: var(--sunk); border-color: transparent; }

button.btn { white-space: nowrap; font: inherit; font-weight: 500; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: var(--r); cursor: pointer; }
button.btn:hover:not(:disabled) { border-color: var(--accent); }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
button.btn.danger { color: var(--bad); }
button.btn:disabled { opacity: 0.5; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 8px; width: 100%; }
textarea { min-height: 72px; resize: vertical; }
label.field { display: grid; gap: 4px; }
label.check { display: inline-flex; gap: 6px; align-items: center; }
label.check input { width: auto; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }

.stepper { display: flex; flex-wrap: wrap; gap: 4px; }
.stepper span { font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; background: var(--sunk); color: var(--muted); }
.stepper span.done { color: var(--ok); }
.stepper span.now { background: var(--accent); color: var(--surface); font-weight: 600; }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--sunk); }

.ticket { font-family: var(--font-doc); font-size: 0.98rem; line-height: 1.6; max-width: 70ch; white-space: pre-wrap; }
.facts { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 2px 14px; font-size: 0.9rem; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.scenario-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.flag { display: grid; gap: 6px; padding: 8px 10px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); }
.flag.blocking { background: var(--bad-soft); }
.flag.resolved { background: var(--sunk); color: var(--muted); }
.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.compare > div { padding: 10px; border-radius: var(--r); background: var(--sunk); min-width: 0; }
.compare .right { box-shadow: inset 3px 0 0 var(--ok); }
.compare .wrong { box-shadow: inset 3px 0 0 var(--bad); }
.compare .pending { box-shadow: inset 3px 0 0 var(--warn); }
.q { display: grid; gap: 4px; }
.q ul { margin: 0; padding-left: 20px; }
.bar { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.notice { padding: 10px 12px; border-radius: var(--r); background: var(--accent-soft); }
.notice.bad { background: var(--bad-soft); }
.notice.warn { background: var(--warn-soft); }
.busybar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 56px); z-index: 4; max-width: 1148px; margin: 12px auto 0; padding: 8px 12px; border-radius: var(--r); background: var(--accent-soft); color: var(--ink); width: calc(100% - 32px); }
body.is-busy button.btn { pointer-events: none; opacity: 0.5; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: var(--r); max-width: calc(100% - 32px); z-index: 10; }
.formprev { background: var(--sunk); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.formprev .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; }
.formprev .section-card { border-top: 6px solid var(--accent); }
pre.help { white-space: pre-wrap; font-family: var(--font-doc); margin: 0; }
details summary { cursor: pointer; }
details.source-row { background: var(--sunk); border-radius: var(--r); padding: 8px 12px; }
@media (prefers-reduced-motion: no-preference) { button.btn { transition: border-color .12s; } }
</style>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><h1>Training Drill Desk</h1><small>Trainers only</small></div>
    <nav class="tabs" id="nav" aria-label="Sections"></nav>
  </div>
</header>
<div id="busy" class="busybar" role="status" hidden></div>
<main id="app">
  <section class="panel">
    <h2>Loading the trainer dashboard…</h2>
    <p class="muted">Drills, scenarios and responses load from this dashboard's database. Trainees never use this page. They answer drills in Google Forms.</p>
  </section>
</main>
<div id="toast" class="toast" role="status" hidden></div>

<script>
// ---- src/core/util.js
// Shared pure helpers. Loaded into the Apps Script global scope and into Node tests
// via a vm context, so everything here is plain functions and `var` globals.

function deepClone(value) {
  return value === undefined ? undefined : JSON.parse(JSON.stringify(value));
}

function pad3(n) {
  return ('000' + n).slice(-3);
}

// djb2 string hash -> short hex. Used for change detection, not security.
function hashString(str) {
  var h = 5381;
  for (var i = 0; i < str.length; i++) {
    h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  }
  return (h >>> 0).toString(16);
}

function hashObject(obj) {
  return hashString(stableStringify(obj));
}

function stableStringify(value) {
  if (value === null || typeof value !== 'object') return JSON.stringify(value);
  if (Array.isArray(value)) return '[' + value.map(stableStringify).join(',') + ']';
  return '{' + Object.keys(value).sort().map(function (k) {
    return JSON.stringify(k) + ':' + stableStringify(value[k]);
  }).join(',') + '}';
}

// Lowercase, unify quotes/dashes, collapse whitespace. Used for citation and leak matching.
function normalizeText(s) {
  return String(s == null ? '' : s)
    .toLowerCase()
    .replace(/[‘’‚′]/g, "'")
    .replace(/[“”„″]/g, '"')
    .replace(/[–—−]/g, '-')
    .replace(/ /g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function uniq(arr) {
  var seen = {};
  return arr.filter(function (x) {
    var k = typeof x === 'string' ? x : JSON.stringify(x);
    if (seen[k]) return false;
    seen[k] = true;
    return true;
  });
}

function isBlank(s) {
  return s == null || String(s).trim() === '';
}

function asArray(v) {
  if (v == null || v === '') return [];
  return Array.isArray(v) ? v : [v];
}

function ServiceError(code, message, details) {
  var e = new Error(message);
  e.code = code;
  e.details = details;
  return e;
}

// ---- src/core/lifecycle.js
// Explicit drill lifecycle. A generated scenario is never treated as approved.

var DrillStatus = {
  DRAFT: 'DRAFT',
  GENERATED: 'GENERATED',
  TRAINER_REVIEW: 'TRAINER_REVIEW',
  APPROVED: 'APPROVED',
  FORM_CREATING: 'FORM_CREATING',
  FORM_CREATED: 'FORM_CREATED',
  SENT: 'SENT',
  RESPONSES_RECEIVED: 'RESPONSES_RECEIVED',
  UNDER_REVIEW: 'UNDER_REVIEW',
  COMPLETED: 'COMPLETED'
};

var DRILL_TRANSITIONS = {
  DRAFT: ['GENERATED', 'TRAINER_REVIEW'],
  GENERATED: ['TRAINER_REVIEW'],
  TRAINER_REVIEW: ['APPROVED'],
  APPROVED: ['TRAINER_REVIEW', 'FORM_CREATING'],
  FORM_CREATING: ['FORM_CREATED'],
  FORM_CREATED: ['SENT', 'RESPONSES_RECEIVED'],
  SENT: ['RESPONSES_RECEIVED'],
  RESPONSES_RECEIVED: ['UNDER_REVIEW', 'COMPLETED'],
  UNDER_REVIEW: ['COMPLETED'],
  COMPLETED: ['UNDER_REVIEW']
};

// Statuses in which trainee-facing content may still change.
var EDITABLE_STATUSES = ['DRAFT', 'GENERATED', 'TRAINER_REVIEW', 'APPROVED'];

// Statuses in which a form exists (or is being created): trainee content is frozen.
var FORM_STATUSES = ['FORM_CREATING', 'FORM_CREATED', 'SENT', 'RESPONSES_RECEIVED', 'UNDER_REVIEW', 'COMPLETED'];

function canTransition(from, to) {
  return from === to || (DRILL_TRANSITIONS[from] || []).indexOf(to) !== -1;
}

function transitionDrill(drill, to, actor, nowIso) {
  var from = drill.status;
  if (from === to) return drill;
  if (!canTransition(from, to)) {
    throw ServiceError('INVALID_TRANSITION', 'Drill ' + drill.drillId + ' cannot move from ' + from + ' to ' + to);
  }
  drill.status = to;
  drill.statusHistory = drill.statusHistory || [];
  drill.statusHistory.push({ from: from, to: to, at: nowIso, by: actor });
  drill.updatedAt = nowIso;
  return drill;
}

function isTraineeContentEditable(status) {
  return EDITABLE_STATUSES.indexOf(status) !== -1;
}

function hasForm(status) {
  return FORM_STATUSES.indexOf(status) !== -1;
}

// ---- src/core/ids.js
// Drill and scenario identifiers. These IDs are the join keys between the answer key,
// the Google Form items and the submitted responses; text, names and timestamps are not.

// APPROVE-DENY-2026-10-01-001
function makeDrillId(prefix, dateStr, existingIds) {
  var base = prefix + '-' + dateStr + '-';
  var max = 0;
  (existingIds || []).forEach(function (id) {
    if (String(id).indexOf(base) === 0) {
      var n = parseInt(String(id).slice(base.length), 10);
      if (!isNaN(n) && n > max) max = n;
    }
  });
  return base + pad3(max + 1);
}

// AD-001. Unique within a drill; never reused after removal (drill.nextScenarioSeq only grows).
function makeScenarioId(prefix, seq) {
  return prefix + '-' + pad3(seq);
}

// Globally unique scenario key: APPROVE-DENY-2026-10-01-001/AD-001
function makeScenarioUid(drillId, scenarioId) {
  return drillId + '/' + scenarioId;
}

function makeAnswerId(drillId, responseId, scenarioId, questionKey) {
  return [drillId, responseId, scenarioId, questionKey].join('|');
}

function makeFormItemKey(drillId, itemKey) {
  return drillId + '|' + itemKey;
}

// Visible prefix on every form question, e.g. "AD-003 · Q2". Doubles as a fallback
// mapping key when only the response sheet headers are available.
function questionTag(scenarioId, questionIndex) {
  return scenarioId + ' · Q' + (questionIndex + 1);
}

var QUESTION_TAG_RE = /^\s*([A-Z][A-Z0-9]*-\d{3})\s*·\s*Q(\d+)\b/;

function parseQuestionTag(title) {
  var m = QUESTION_TAG_RE.exec(String(title || ''));
  if (!m) return null;
  return { scenarioId: m[1], questionNumber: parseInt(m[2], 10) };
}

function traineeIdFor(email, name) {
  if (!isBlank(email)) return 'email:' + String(email).trim().toLowerCase();
  if (!isBlank(name)) return 'name:' + normalizeText(name);
  return 'unknown';
}

// ---- src/core/schemas.js
// Canonical data shapes, the trainee/trainer split, and validation.
//
// Scenario record (stored in the Scenarios table):
// {
//   scenarioUid, scenarioId, drillId, drillType, version, status: 'ACTIVE'|'REMOVED',
//   difficulty, category, generatedBy: 'CLAUDE'|'MANUAL', createdAt, updatedAt,
//   reviewFlags: [{ code, message, blocking, resolvable, resolved, resolvedBy, resolvedNote }],
//   trainee: {                       <- the ONLY part that may reach the Google Form
//     title, scenario, accountDetails: [{label, value}], traineeInstructions,
//     questions: [{ key, prompt, type, choices, required, helpText }]
//   },
//   trainer: {                       <- never leaves the dashboard
//     correctAnswer: { [questionKey]: string | string[] },
//     correctDecision, requiredAccountDetail, rationale,
//     sources: [{ sourceType, sectionId, title, heading, quote, url, verified }],
//     scoring: { [questionKey]: { mode: 'AUTO'|'MANUAL', points, method, criteria, gapTagOnWrong } },
//     scoringCriteria, commonMistakes: [string], coachingNotes, trainerNotes
//   }
// }

var QUESTION_TYPES = ['CHECKBOX', 'MULTIPLE_CHOICE', 'SHORT_TEXT', 'PARAGRAPH'];
var CHOICE_TYPES = ['CHECKBOX', 'MULTIPLE_CHOICE'];

var TRAINEE_SCENARIO_FIELDS = ['title', 'scenario', 'accountDetails', 'traineeInstructions', 'questions'];
var TRAINEE_QUESTION_FIELDS = ['key', 'prompt', 'type', 'choices', 'required', 'helpText'];

// Document collections in the dashboard database. Responses are one document per
// form submission (answers + scores embedded) to stay well under the store's
// document cap when the drill runs daily.
var COLLECTIONS = {
  drills: 'drills',          // drillId
  scenarios: 'scenarios',    // <drillId>__<scenarioId>
  responses: 'responses',    // <drillId>__<responseId>
  catalog: 'catalog',        // catalogId
  sources: 'sources',        // kl-000... Library chunks, slack-<channelId> CSQ channel pulls
  settings: 'settings',      // 'main'
  deletedDrills: 'deletedDrills' // drillId; deleted IDs are never reused (the bridge keys forms by drill ID)
};

function scenarioDocId(drillId, scenarioId) {
  return drillId + '__' + scenarioId;
}

function responseDocId(drillId, responseId) {
  return drillId + '__' + String(responseId).replace(/[^A-Za-z0-9_\-.~:@+]/g, '_');
}

function toTraineeVersion(scenario) {
  var t = scenario.trainee || {};
  var out = {};
  TRAINEE_SCENARIO_FIELDS.forEach(function (f) {
    if (f === 'questions') return;
    if (t[f] !== undefined) out[f] = deepClone(t[f]);
  });
  out.scenarioId = scenario.scenarioId;
  out.questions = (t.questions || []).map(function (q) {
    var qq = {};
    TRAINEE_QUESTION_FIELDS.forEach(function (f) {
      if (q[f] !== undefined) qq[f] = deepClone(q[f]);
    });
    return qq;
  });
  return out;
}

function collectStrings(value, out) {
  out = out || [];
  if (value == null) return out;
  if (typeof value === 'string') out.push(value);
  else if (Array.isArray(value)) value.forEach(function (v) { collectStrings(v, out); });
  else if (typeof value === 'object') Object.keys(value).forEach(function (k) { collectStrings(value[k], out); });
  return out;
}

// Trainer text that must never appear in trainee-facing text. The correct decision and
// the required account detail are deliberately excluded: the decision is one of the
// answer choices and the account detail is a fact the trainee must find in the ticket.
function trainerOnlyStrings(trainer) {
  trainer = trainer || {};
  var strs = [];
  collectStrings(trainer.rationale, strs);
  collectStrings(trainer.coachingNotes, strs);
  collectStrings(trainer.trainerNotes, strs);
  collectStrings(trainer.commonMistakes, strs);
  collectStrings(trainer.scoringCriteria, strs);
  (trainer.sources || []).forEach(function (s) { collectStrings(s.quote, strs); });
  return strs.map(normalizeText).filter(function (s) { return s.length >= 25; });
}

var LEAK_MARKERS = ['answer key', 'correct answer', 'rationale:', 'coaching note', 'scoring rubric', 'trainer note'];

function findTraineeLeaks(traineeVersion, trainer) {
  var traineeText = normalizeText(collectStrings(traineeVersion).join(' \n '));
  var leaks = [];
  trainerOnlyStrings(trainer).forEach(function (s) {
    if (traineeText.indexOf(s) !== -1) leaks.push('Trainer-only text appears in trainee content: "' + s.slice(0, 60) + '…"');
  });
  LEAK_MARKERS.forEach(function (m) {
    if (traineeText.indexOf(m) !== -1) leaks.push('Trainee content contains the phrase "' + m + '"');
  });
  return leaks;
}

function validateScenario(scenario) {
  var errors = [];
  var t = scenario.trainee || {};
  var tr = scenario.trainer || {};
  if (isBlank(t.scenario)) errors.push('Customer ticket text is empty.');
  if (!t.questions || !t.questions.length) errors.push('Scenario has no questions.');
  var keys = {};
  (t.questions || []).forEach(function (q, i) {
    var label = 'Question ' + (i + 1);
    if (isBlank(q.key)) errors.push(label + ' has no key.');
    if (keys[q.key]) errors.push(label + ' duplicates key ' + q.key + '.');
    keys[q.key] = true;
    if (isBlank(q.prompt)) errors.push(label + ' has no prompt.');
    if (QUESTION_TYPES.indexOf(q.type) === -1) errors.push(label + ' has unsupported type ' + q.type + '.');
    var isChoice = CHOICE_TYPES.indexOf(q.type) !== -1;
    if (isChoice && (!q.choices || q.choices.length < 2)) errors.push(label + ' needs at least two answer choices.');
    var rule = (tr.scoring || {})[q.key];
    if (!rule) {
      errors.push(label + ' has no scoring rule.');
      return;
    }
    if (rule.mode === 'AUTO') {
      if (!isChoice) errors.push(label + ' is auto-scored but is not a choice question.');
      var expected = asArray((tr.correctAnswer || {})[q.key]);
      if (!expected.length) errors.push(label + ' is auto-scored but has no correct answer.');
      expected.forEach(function (e) {
        if ((q.choices || []).indexOf(e) === -1) errors.push(label + ' correct answer "' + e + '" is not one of its choices.');
      });
      if (q.type === 'MULTIPLE_CHOICE' && expected.length > 1) errors.push(label + ' is single-choice but has several correct answers.');
    }
  });
  return errors;
}

function activeScenarios(scenarios) {
  return scenarios.filter(function (s) { return s.status !== 'REMOVED'; })
    .sort(function (a, b) { return a.scenarioId < b.scenarioId ? -1 : 1; });
}

function traineeContentHash(scenarios) {
  return hashObject(activeScenarios(scenarios).map(toTraineeVersion));
}

function blockingFlags(scenario) {
  return (scenario.reviewFlags || []).filter(function (f) { return f.blocking && !f.resolved; });
}

// ---- src/core/grounding.js
// Source grounding: pick the relevant source sections for a drill and verify that every
// quote the generator cites really exists in the approved source material.
//
// Section: { sectionId, sourceType: 'KNOWLEDGE_LIBRARY'|'CSQ_SLACK', title, heading, path, url, text }

var MIN_QUOTE_LENGTH = 12;

// priorityKeywords (the drill topic) outweigh the drill type's own keywords.
function selectSections(sections, keywords, maxChars, priorityKeywords) {
  maxChars = maxChars || 60000;
  var groups = [[(keywords || []).map(normalizeText).filter(Boolean), 1], [(priorityKeywords || []).map(normalizeText).filter(Boolean), 6]];
  var scored = sections.map(function (s) {
    var heading = normalizeText(s.path || s.heading);
    var text = normalizeText(s.text);
    var score = 0;
    groups.forEach(function (g) {
      g[0].forEach(function (k) {
        if (heading.indexOf(k) !== -1) score += 5 * g[1];
        var idx = text.indexOf(k);
        var hits = 0;
        while (idx !== -1 && hits < 10) {
          hits++;
          idx = text.indexOf(k, idx + k.length);
        }
        score += hits * g[1];
      });
    });
    return { section: s, score: score };
  }).filter(function (x) { return x.score > 0; });
  scored.sort(function (a, b) { return b.score - a.score; });
  var out = [];
  var total = 0;
  scored.forEach(function (x) {
    var len = (x.section.text || '').length;
    if (total + len > maxChars && out.length) return;
    out.push(x.section);
    total += len;
  });
  return out;
}

function formatSectionsForPrompt(sections) {
  return sections.map(function (s) {
    return '<source id="' + s.sectionId + '" type="' + s.sourceType + '" heading="' +
      String(s.path || s.heading || '').replace(/"/g, "'") + '">\n' + s.text + '\n</source>';
  }).join('\n\n');
}

// citations: [{ sectionId, quote }] -> same list with verified/heading/url filled in.
function verifyCitations(citations, sections) {
  var byId = {};
  sections.forEach(function (s) { byId[s.sectionId] = s; });
  return (citations || []).map(function (c) {
    var quote = normalizeText(c.quote);
    var result = {
      sourceType: null, sectionId: c.sectionId || null, title: null, heading: null,
      url: null, quote: c.quote || '', supports: c.supports || '', verified: false
    };
    if (quote.length < MIN_QUOTE_LENGTH) return result;
    var candidates = byId[c.sectionId] ? [byId[c.sectionId]] : [];
    candidates = candidates.concat(sections.filter(function (s) { return s.sectionId !== c.sectionId; }));
    for (var i = 0; i < candidates.length; i++) {
      var s = candidates[i];
      if (normalizeText(s.text).indexOf(quote) !== -1) {
        result.sectionId = s.sectionId;
        result.sourceType = s.sourceType;
        result.title = s.title;
        result.heading = s.path || s.heading;
        result.url = s.url;
        result.verified = true;
        break;
      }
    }
    return result;
  });
}

// Review flags derived from source verification. Unsupported answers are flagged for the
// trainer instead of being presented as policy.
function sourceFlags(verifiedSources, sectionsProvided) {
  var flags = [];
  if (!sectionsProvided) {
    flags.push(makeFlag('NO_SOURCE_MATERIAL', 'No approved source sections matched this drill type. Refresh sources or check the source configuration.', true));
    return flags;
  }
  var verified = verifiedSources.filter(function (s) { return s.verified; });
  if (!verifiedSources.length || !verified.length) {
    flags.push(makeFlag('UNVERIFIED_SOURCE', 'None of the cited quotes could be found in the approved sources. Confirm the answer key against the source before approving.', true));
  }
  return flags;
}

function makeFlag(code, message, blocking, resolvable) {
  return {
    code: code, message: message, blocking: !!blocking,
    resolvable: resolvable === undefined ? true : !!resolvable,
    resolved: false, resolvedBy: null, resolvedNote: null
  };
}

// ---- src/core/jsonCheck.js
// Minimal JSON Schema check for model output (the subset our schemas use: object,
// array, string, boolean, number, enum, required, additionalProperties:false).
// Returns a list of problems; empty means the value fits.

function checkJsonAgainstSchema(value, schema, path) {
  path = path || '$';
  var problems = [];
  if (!schema) return problems;
  var t = schema.type;
  if (t === 'object') {
    if (value === null || typeof value !== 'object' || Array.isArray(value)) return [path + ' should be an object'];
    (schema.required || []).forEach(function (k) {
      if (!(k in value)) problems.push(path + '.' + k + ' is missing');
    });
    Object.keys(value).forEach(function (k) {
      var sub = (schema.properties || {})[k];
      if (!sub) {
        if (schema.additionalProperties === false) problems.push(path + '.' + k + ' is not expected');
        return;
      }
      problems = problems.concat(checkJsonAgainstSchema(value[k], sub, path + '.' + k));
    });
  } else if (t === 'array') {
    if (!Array.isArray(value)) return [path + ' should be an array'];
    value.forEach(function (v, i) {
      problems = problems.concat(checkJsonAgainstSchema(v, schema.items, path + '[' + i + ']'));
    });
  } else if (t === 'string') {
    if (typeof value !== 'string') problems.push(path + ' should be a string');
  } else if (t === 'boolean') {
    if (typeof value !== 'boolean') problems.push(path + ' should be true/false');
  } else if (t === 'number' || t === 'integer') {
    if (typeof value !== 'number') problems.push(path + ' should be a number');
  }
  if (schema.enum && schema.enum.indexOf(value) === -1) problems.push(path + ' must be one of: ' + schema.enum.join(', '));
  return problems;
}

// Turn a schema into a compact instruction for models that are not schema-constrained.
function describeSchemaForPrompt(schema) {
  return 'Reply with ONLY one JSON value (no prose, no code fence) that matches this JSON Schema exactly:\n' + JSON.stringify(schema);
}

// ---- src/core/topics.js
// Drill topics. A trainer picks a preset, a Knowledge Library topic, or types their own;
// the topic steers which source sections are used and what every ticket is about.

var TOPIC_PRESETS = [
  { label: 'Lockout tickets', keywords: ['lockout', 'lock-out', 'locked out', 'lock out', 'could not get in', 'access'] },
  { label: 'Unused DHJ vouchers', keywords: ['unused dhj', 'dhj voucher', 'unused voucher', 'voucher'] },
  { label: 'FCF memberships', keywords: ['fcf', 'forever clean flex', 'membership fee', 'mf'] },
  { label: 'Legacy FC / DHJ memberships', keywords: ['legacy', 'dhj', 'forever clean', 'fc table'] },
  { label: 'ETF waivers', keywords: ['etf', 'early termination', 'waive', 'waiver'] },
  { label: 'Free month offers', keywords: ['free month', 'retention offer', 'retention'] },
  { label: 'MF reductions', keywords: ['mf reduction', 'membership fee', 'reduce', 'discount'] },
  { label: 'Voucher refunds', keywords: ['voucher refund', 'self-refund', 'refund link', 'voucher'] },
  { label: 'Refund requests', keywords: ['refund', 'chargeback', 'dispute'] },
  { label: 'Cancellations and retention', keywords: ['cancel', 'cancellation', 'retention', 'retain'] }
];

var TOPIC_STOPWORDS = { the: 1, and: 1, for: 1, with: 1, tickets: 1, ticket: 1, issues: 1, issue: 1, about: 1, cases: 1, case: 1 };

function topicKeywords(topic) {
  if (isBlank(topic)) return [];
  var all = TOPIC_PRESETS.concat(typeof CP_TOPIC_PRESETS !== 'undefined' ? CP_TOPIC_PRESETS : []);
  var preset = all.filter(function (p) { return normalizeText(p.label) === normalizeText(topic); })[0];
  if (preset) return preset.keywords.slice();
  var words = normalizeText(topic).split(/[^a-z0-9-]+/).filter(function (w) { return w.length >= 3 && !TOPIC_STOPWORDS[w]; });
  return uniq([normalizeText(topic)].concat(words));
}

// Top-level Knowledge Library topics (tab names) for the topic picker.
function libraryTopics(sections) {
  var counts = {};
  (sections || []).forEach(function (s) {
    if (s.sourceType !== 'KNOWLEDGE_LIBRARY' || !s.path) return;
    var top = s.path.split(' > ')[0].trim();
    if (top && top.length <= 60) counts[top] = (counts[top] || 0) + 1;
  });
  return Object.keys(counts).filter(function (t) { return counts[t] >= 2 && !/table of contents|welcome/i.test(t); }).sort();
}

function sectionsMatchingTopic(sections, topic) {
  var kws = topicKeywords(topic).map(normalizeText);
  if (!kws.length) return sections;
  return sections.filter(function (s) {
    var hay = normalizeText((s.path || s.heading || '') + ' ' + s.text);
    return kws.some(function (k) { return hay.indexOf(k) !== -1; });
  });
}

// ---- src/core/readability.js
// Keeps generated tickets short, plain and current. Problems found here trigger one
// automatic rewrite; anything left after that becomes a small note for the trainer.

var READ_LIMITS = { ticketWords: 90, titleWords: 7, detailCount: 6, detailWords: 10, rationaleWords: 45 };

// Fields that do not exist in Homeaglow's agent tools.
var INVENTED_FIELD_RE = /\b(app\s*version|device|browser|operating\s*system|os\s*version|ip\s*address|user\s*agent|build\s*number|sdk)\b/i;

var MONTHS = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, sept: 8, oct: 9, nov: 10, dec: 11 };

function wordCount(s) {
  return String(s || '').trim().split(/\s+/).filter(Boolean).length;
}

// Every explicit date in the text: "Sep 24, 2026", "September 2026", "2026-09-24", "9/24/2026".
function findDates(text) {
  var out = [];
  var s = String(text || '');
  var m;
  var re1 = /\b(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})?,?\s*(\d{4})\b/gi;
  while ((m = re1.exec(s))) out.push({ text: m[0], date: new Date(Date.UTC(+m[3], MONTHS[m[1].toLowerCase().slice(0, 4)] !== undefined ? MONTHS[m[1].toLowerCase().slice(0, 4)] : MONTHS[m[1].toLowerCase().slice(0, 3)], +(m[2] || 1))) });
  var re2 = /\b(\d{4})-(\d{2})-(\d{2})\b/g;
  while ((m = re2.exec(s))) out.push({ text: m[0], date: new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) });
  var re3 = /\b(\d{1,2})\/(\d{1,2})\/(\d{4})\b/g;
  while ((m = re3.exec(s))) out.push({ text: m[0], date: new Date(Date.UTC(+m[3], +m[1] - 1, +m[2])) });
  return out;
}

function scenarioTraineeText(out) {
  return [out.title, out.ticket].concat((out.accountDetails || []).map(function (d) { return d.label + ': ' + d.value; })).join('\n');
}

// today: 'YYYY-MM-DD'. Dates must fall within the last 12 months or the next 2 months.
function checkReadability(out, today) {
  var problems = [];
  if (wordCount(out.ticket) > READ_LIMITS.ticketWords) problems.push('Ticket is ' + wordCount(out.ticket) + ' words; keep it under ' + READ_LIMITS.ticketWords + '.');
  if (wordCount(out.title) > READ_LIMITS.titleWords) problems.push('Title is too long; use ' + READ_LIMITS.titleWords + ' words or fewer.');
  if ((out.accountDetails || []).length > READ_LIMITS.detailCount) problems.push('Use at most ' + READ_LIMITS.detailCount + ' account details.');
  (out.accountDetails || []).forEach(function (d) {
    if (wordCount(d.value) > READ_LIMITS.detailWords) problems.push('Account detail "' + d.label + '" is too long; keep each value under ' + READ_LIMITS.detailWords + ' words.');
  });
  (out.accountDetails || []).forEach(function (d) {
    if (INVENTED_FIELD_RE.test(d.label || '')) problems.push('Account detail "' + d.label + '" is not a field agents see; remove it.');
  });
  if (wordCount(out.rationale) > READ_LIMITS.rationaleWords) problems.push('Rationale is too long; 2 short sentences.');
  var now = new Date(today + 'T00:00:00Z').getTime();
  var day = 24 * 3600 * 1000;
  findDates(scenarioTraineeText(out)).forEach(function (d) {
    var t = d.date.getTime();
    if (isNaN(t)) return;
    if (t < now - 366 * day || t > now + 62 * day) problems.push('Date "' + d.text + '" is not current; use dates within the last 12 months of ' + today + '.');
  });
  return problems;
}

function humanDate(today) {
  var d = new Date(today + 'T00:00:00Z');
  return ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getUTCMonth()] + ' ' + d.getUTCDate() + ', ' + d.getUTCFullYear();
}

// ---- src/drills/approveDeny.js
// Drill 1 — "Approve or Deny" speed drill (daily, 5 complex membership tickets, 15 minutes).

// Every offer or action a C-side agent can take on a membership ticket, as the Knowledge
// Library groups them: retention (keep the membership), exit (close it out fairly) and
// make-right (fix a charge we caused).
var APPROVE_DENY_ACTION_GROUPS = [
  { group: 'Retention', actions: ['Voucher or credit', 'MF reduction', 'MCT reduction', 'Free month', 'Pause membership', 'Set Max CP Rate'] },
  { group: 'Exit', actions: ['ETF reduction', 'ETF waiver', 'MF refund', 'Cancel membership'] },
  { group: 'Make-right', actions: ['Refund a fee (LMC, lockout or priority)'] }
];
var APPROVE_DENY_ACTIONS = APPROVE_DENY_ACTION_GROUPS.reduce(function (all, g) { return all.concat(g.actions); }, []).concat(['None of the above']);

var APPROVE_DENY_TYPE = {
  type: 'APPROVE_DENY',
  name: 'Approve or Deny',
  description: 'Decide which offer or action the member qualifies for and name the account detail that proves it.',
  drillIdPrefix: 'APPROVE-DENY',
  scenarioIdPrefix: 'AD',
  cadence: 'DAILY',
  defaults: { scenarioCount: 5, targetMinutes: 15, difficulty: 'HARD' },
  requiresCatalog: false,
  audiences: ['CUSTOMER'],
  sourceKeywords: [
    'free month', 'mf reduction', 'membership fee', 'etf', 'early termination', 'waiver', 'waive',
    'retention', 'retain', 'cancel', 'cancellation', 'membership', 'forever clean', 'downgrade', 'pause',
    'mct', 'minimum commitment', 'voucher', 'credit', 'max cp rate', 'refund', 'offer', 'exit offer', 'make-right'
  ],

  formInstructions: function (drill) {
    return 'Approve or Deny \u2014 ' + drill.config.scenarioCount + ' tickets, about ' + drill.config.targetMinutes + ' minutes.\n' +
      'For each ticket: pick the offer or action, name the account detail that proves it, and say why in a sentence.';
  },

  questions: function () {
    return [
      {
        key: 'action', type: 'CHECKBOX', required: true,
        prompt: 'What should you offer or do? (pick all that apply)',
        choices: APPROVE_DENY_ACTIONS.slice(),
        scoring: { mode: 'AUTO', points: 2, method: 'EXACT_SET', gapTagOnWrong: 'INCORRECT_DECISION', criteria: 'Full credit only when the picks match the answer key exactly.' }
      },
      {
        key: 'accountDetail', type: 'SHORT_TEXT', required: true,
        prompt: 'Which account detail tells you?',
        scoring: { mode: 'MANUAL', points: 2, method: 'TRAINER', gapTagOnWrong: 'MISSING_ACCOUNT_DETAIL', criteria: 'Names the exact account fact, not a general policy.' }
      },
      {
        key: 'explanation', type: 'PARAGRAPH', required: true,
        prompt: 'Why? (1\u20132 sentences)',
        scoring: { mode: 'MANUAL', points: 1, method: 'TRAINER', gapTagOnWrong: 'WEAK_REASONING', criteria: 'Links the detail to the right policy.' }
      }
    ];
  },

  promptGuidance: function () {
    return [
      'Drill: "Approve or Deny". The trainee must decide which offers or actions the member qualifies for. The full list, by type: ' +
        APPROVE_DENY_ACTION_GROUPS.map(function (g) { return g.group + ': ' + g.actions.join(', '); }).join('; ') + '.',
      'Pick the answer the sources support for this exact situation. More than one action may apply only if the sources say they can be combined ' +
        '(e.g. Cancel membership together with ETF waiver). Vary the correct answer across tickets; do not default to Free month.',
      'correctActions must be chosen strictly from that list. Use "None of the above" alone, never combined with another action; it means the agent should only explain, with no offer or account action.',
      'requiredAccountDetail must be one concrete fact that appears verbatim (or nearly verbatim) in accountDetails or the ticket, e.g. a date, count, plan, or prior action.',
      'Include at least two relevant-looking but irrelevant facts and at least one conflicting signal so the trainee has to identify what matters.'
    ].join('\n');
  },

  outputSchema: function () {
    var schema = commonScenarioOutputSchema();
    schema.properties.correctActions = { type: 'array', items: { type: 'string', enum: APPROVE_DENY_ACTIONS } };
    schema.properties.requiredAccountDetail = { type: 'string' };
    schema.required.push('correctActions', 'requiredAccountDetail');
    return schema;
  },

  buildAnswerKey: function (out) {
    var actions = uniq(asArray(out.correctActions));
    return {
      correctAnswer: { action: actions, accountDetail: out.requiredAccountDetail || '' },
      correctDecision: actions.join(' + '),
      requiredAccountDetail: out.requiredAccountDetail || '',
      category: 'Membership retention',
      flags: []
    };
  },

  // Type-specific checks, re-run on every edit (see recomputeContentFlags).
  validate: function (scenario) {
    var actions = asArray((scenario.trainer.correctAnswer || {}).action);
    if (actions.indexOf('None of the above') !== -1 && actions.length > 1) {
      return ['"None of the above" is combined with another action in the correct answer.'];
    }
    return [];
  }
};

// Output fields every drill type asks the model for.
function commonScenarioOutputSchema() {
  return {
    type: 'object',
    additionalProperties: false,
    properties: {
      insufficientSource: { type: 'boolean' },
      insufficientReason: { type: 'string' },
      title: { type: 'string' },
      ticket: { type: 'string' },
      accountDetails: {
        type: 'array',
        items: {
          type: 'object', additionalProperties: false,
          properties: { label: { type: 'string' }, value: { type: 'string' } },
          required: ['label', 'value']
        }
      },
      rationale: { type: 'string' },
      commonMistakes: { type: 'array', items: { type: 'string' } },
      coachingNotes: { type: 'string' },
      citations: {
        type: 'array',
        items: {
          type: 'object', additionalProperties: false,
          properties: { sectionId: { type: 'string' }, quote: { type: 'string' }, supports: { type: 'string' } },
          required: ['sectionId', 'quote', 'supports']
        }
      },
      sourceConflict: { type: 'string' }
    },
    required: ['insufficientSource', 'insufficientReason', 'title', 'ticket', 'accountDetails', 'rationale', 'commonMistakes', 'coachingNotes', 'citations', 'sourceConflict']
  };
}

// ---- src/drills/triage.js
// Drill 2 — "Triage-Only" drill (30 minutes, mixed tickets).
// Trainees identify the process, the tag and the checklist; they do not write a reply.
//
// Answer choices are NOT hardcoded. They come from the process catalog, which is
// extracted from the approved sources (each entry carries a verified quote) and approved
// by a trainer before any triage drill can be generated.

var TRIAGE_CATEGORIES = ['Unused-voucher issue', 'Lock-out refund', 'Voucher refund', 'General retention'];
var TRIAGE_CATEGORIES_BY_AUDIENCE = {
  CUSTOMER: TRIAGE_CATEGORIES,
  CP: ['CP lockout', 'Payout issue', 'Job claim or cancellation', 'Account or deactivation']
};

function triageCategories(audienceId) {
  return TRIAGE_CATEGORIES_BY_AUDIENCE[audienceId] || TRIAGE_CATEGORIES;
}

var TRIAGE_TYPE = {
  type: 'TRIAGE',
  name: 'Triage-Only',
  description: 'Identify the correct process, tag and interactive checklist for a mix of tickets. No customer reply is written.',
  drillIdPrefix: 'TRIAGE',
  scenarioIdPrefix: 'TR',
  cadence: 'AD_HOC',
  defaults: { scenarioCount: 8, targetMinutes: 30, difficulty: 'MEDIUM' },
  requiresCatalog: true,
  categories: TRIAGE_CATEGORIES,
  categoriesByAudience: TRIAGE_CATEGORIES_BY_AUDIENCE,
  audiences: ['CUSTOMER', 'CP'],
  sourceKeywords: [
    'unused voucher', 'voucher', 'lock-out', 'lockout', 'locked out', 'refund', 'retention',
    'checklist', 'interactive checklist', 'tag', 'process', 'macro', 'workflow', 'triage'
  ],

  formInstructions: function (drill) {
    return 'Triage \u2014 about ' + drill.config.targetMinutes + ' minutes. Do not write a reply.\n' +
      'For each ticket: pick the process, the tag and the checklist to launch.';
  },

  // ctx.catalog: approved catalog entries.
  questions: function (ctx) {
    var catalog = ctx.catalog || [];
    var names = uniq(catalog.map(function (c) { return c.name; }).filter(Boolean));
    var tags = uniq(catalog.map(function (c) { return c.tag; }).filter(Boolean));
    var checklists = uniq(catalog.map(function (c) { return c.checklist; }).filter(Boolean));
    var qs = [{
      key: 'process', type: 'MULTIPLE_CHOICE', required: true,
      prompt: 'Which process?', choices: names,
      scoring: { mode: 'AUTO', points: 2, method: 'EXACT', gapTagOnWrong: 'INCORRECT_PROCESS', criteria: 'Matches the documented process for this ticket.' }
    }];
    if (tags.length >= 2) {
      qs.push({
        key: 'tag', type: 'MULTIPLE_CHOICE', required: true,
        prompt: 'Which tag?', choices: tags,
        scoring: { mode: 'AUTO', points: 1, method: 'EXACT', gapTagOnWrong: 'INCORRECT_TAG', criteria: 'Matches the documented tag for the process.' }
      });
    }
    if (checklists.length >= 2) {
      qs.push({
        key: 'checklist', type: 'MULTIPLE_CHOICE', required: true,
        prompt: 'Which checklist?', choices: checklists,
        scoring: { mode: 'AUTO', points: 1, method: 'EXACT', gapTagOnWrong: 'INCORRECT_CHECKLIST', criteria: 'Matches the documented interactive checklist for the process.' }
      });
    }
    qs.push({
      key: 'reasoning', type: 'SHORT_TEXT', required: false,
      prompt: 'What told you? (optional)',
      scoring: { mode: 'MANUAL', points: 0, method: 'TRAINER', gapTagOnWrong: 'WEAK_REASONING', criteria: 'Not scored; used for coaching.' }
    });
    return qs;
  },

  promptGuidance: function (ctx) {
    var list = (ctx.catalog || []).map(function (c) {
      return '- id=' + c.catalogId + ' | process="' + c.name + '" | tag="' + (c.tag || '') + '" | checklist="' + (c.checklist || '') +
        '" | category="' + (c.category || '') + '" | when to use: ' + (c.whenToUse || '');
    }).join('\n');
    return [
      'Drill: "Triage-Only". The trainee does not reply to the customer; they only pick the process, tag and checklist.',
      'Approved process catalog (the ONLY valid answers):\n' + list,
      'correctProcessId must be one of the catalog ids above. Aim for this category: ' + (ctx.category || 'any of ' + triageCategories(ctx.audience).join(', ')) + '. Then set "category" to whichever category (' + triageCategories(ctx.audience).join(', ') + ') really fits the ticket you wrote.',
      'Write the ticket so that surface keywords point toward a plausible but wrong process at least some of the time; the account facts must decide it.',
      'requiredAccountDetail is the single fact that determines the process.'
    ].join('\n\n');
  },

  outputSchema: function (ctx) {
    var schema = commonScenarioOutputSchema();
    var ids = (ctx.catalog || []).map(function (c) { return c.catalogId; });
    schema.properties.category = { type: 'string', enum: triageCategories(ctx.audience) };
    schema.properties.correctProcessId = ids.length ? { type: 'string', enum: ids } : { type: 'string' };
    schema.properties.requiredAccountDetail = { type: 'string' };
    schema.required.push('category', 'correctProcessId', 'requiredAccountDetail');
    return schema;
  },

  buildAnswerKey: function (out, ctx, questions) {
    var entry = (ctx.catalog || []).filter(function (c) { return c.catalogId === out.correctProcessId; })[0];
    var flags = [];
    if (!entry) {
      flags.push(makeFlag('UNKNOWN_PROCESS', 'The generator chose a process that is not in the approved catalog.', true, false));
      return { correctAnswer: {}, correctDecision: '', requiredAccountDetail: out.requiredAccountDetail || '', category: out.category, flags: flags, questions: questions };
    }
    var correct = { process: entry.name, reasoning: out.requiredAccountDetail || '' };
    // Only ask about a tag/checklist the source documents for this process.
    var qs = questions.filter(function (q) {
      if (q.key === 'tag') return !isBlank(entry.tag);
      if (q.key === 'checklist') return !isBlank(entry.checklist);
      return true;
    });
    if (!isBlank(entry.tag)) correct.tag = entry.tag;
    if (!isBlank(entry.checklist)) correct.checklist = entry.checklist;
    return {
      correctAnswer: correct,
      correctDecision: entry.name + (entry.tag ? ' / tag: ' + entry.tag : '') + (entry.checklist ? ' / checklist: ' + entry.checklist : ''),
      requiredAccountDetail: out.requiredAccountDetail || '',
      category: out.category,
      catalogId: entry.catalogId,
      catalogSources: entry.sources || [],
      flags: flags,
      questions: qs
    };
  },

  // A multi-word process, a tag or a checklist name copied into the ticket gives the answer away.
  styleCheck: function (out, ctx) {
    var choices = [];
    (ctx.catalog || []).forEach(function (c) { choices.push(c.name, c.tag, c.checklist); });
    return giveawayProblems(out.ticket, out.accountDetails, choices);
  },

  validate: function (scenario) {
    var choices = [];
    (scenario.trainee.questions || []).forEach(function (q) { choices = choices.concat(q.choices || []); });
    return giveawayProblems(scenario.trainee.scenario, scenario.trainee.accountDetails, choices);
  },

  catalogPromptGuidance: function (audienceId) {
    return [
      'Extract the list of documented ticket-handling processes ' + (audienceId === 'CP' ? 'that CP-side agents use for tickets from cleaner partners (CPs)' : 'that C-side agents use for customer tickets') +
        ', relevant to these categories: ' + triageCategories(audienceId).join(', ') + '. ',
      'For each process give: name = a short label of 2 to 5 key words taken from the source heading, dropping filler such as "Process guide", "How to", "if C wants" ',
      '(example: "Process Guide if C wants a Groupon Voucher refunded" becomes "Groupon voucher refund"); sourceTitle = the heading exactly as written in the source; ',
      'the exact tag to apply (empty string if the source does not name one); the exact interactive checklist/process to launch (empty string if not documented); ',
      'the best-fitting category; when to use it in one short line; and kind.',
      'kind = "PROCESS" only when the source gives steps an agent follows to handle a ticket. ',
      'Reference material is NOT a process: code lists, reason codes, penalty ladders, strike or warning tiers, rate or fee tables, matrices, glossaries, definitions, overviews and FAQs. ',
      'Mark those kind = "REFERENCE" (they are not answer choices). ',
      'Do not invent processes, tags or checklists. Every entry needs at least one verbatim quote from the sources.'
    ].join('');
  },

  catalogOutputSchema: function (audienceId) {
    return {
      type: 'object', additionalProperties: false,
      properties: {
        entries: {
          type: 'array',
          items: {
            type: 'object', additionalProperties: false,
            properties: {
              name: { type: 'string' }, sourceTitle: { type: 'string' }, tag: { type: 'string' }, checklist: { type: 'string' },
              category: { type: 'string', enum: triageCategories(audienceId) }, whenToUse: { type: 'string' },
              kind: { type: 'string', enum: ['PROCESS', 'REFERENCE'] },
              citations: {
                type: 'array',
                items: {
                  type: 'object', additionalProperties: false,
                  properties: { sectionId: { type: 'string' }, quote: { type: 'string' }, supports: { type: 'string' } },
                  required: ['sectionId', 'quote', 'supports']
                }
              }
            },
            required: ['name', 'sourceTitle', 'tag', 'checklist', 'category', 'whenToUse', 'kind', 'citations']
          }
        }
      },
      required: ['entries']
    };
  }
};

// Short trainee-facing process label from a Knowledge Library heading, used when the
// generator returns a long name: "Process Guide if C wants a Groupon Voucher refunded"
// -> "Groupon Voucher refund".
var PROCESS_FILLER = [
  /^\s*(?:\p{Extended_Pictographic}|[^\w\s])+\s*/u,
  /^(?:the\s+)?(?:process\s+guide|guide|process|sop|workflow|how\s+to\s+handle|how\s+to)\s*(?:for|on|if|when|to|:|-|\u2013|\u2014)?\s*/i,
  /^(?:if|when)\s+/i,
  /^(?:the\s+)?(?:c|cx|customer|member)\s+(?:wants|asks|requests|is\s+asking)\s+(?:for\s+|to\s+(?:have\s+|get\s+)?)?(?:a|an|the|their|his|her)?\s*/i
];

var PROCESS_NAME_VERSION = 3;

// Knowledge Library headings that are lookup material, not a process an agent runs.
var REFERENCE_TITLE_RE = /\b(reason\s+codes?|codes?\s+(?:list|table)|ladders?|matrix|matrices|tables?|glossary|definitions?|overview|faqs?|cheat\s*sheet|list\s+of|rate\s+card)\b/i;

function isReferenceEntry(e) {
  if (e.kind === 'REFERENCE') return true;
  return REFERENCE_TITLE_RE.test(String(e.name || '')) || REFERENCE_TITLE_RE.test(String(e.sourceTitle || ''));
}

function shortProcessName(name) {
  var s = String(name || '').trim();
  for (var pass = 0; pass < 3; pass++) {
    PROCESS_FILLER.forEach(function (re) { s = s.replace(re, ''); });
  }
  s = s.replace(/\s+(?:process|guide|procedure)$/i, '').replace(/\brefunded\b/i, 'refund').replace(/\s+/g, ' ').trim();
  var words = s.split(' ');
  if (words.length > 6) s = words.slice(0, 6).join(' ');
  if (!s) return String(name || '').trim();
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function giveawayProblems(ticket, accountDetails, choices) {
  var text = normalizeText([ticket].concat((accountDetails || []).map(function (d) { return d.label + ': ' + d.value; })).join(' \n '));
  return uniq((choices || []).filter(function (c) {
    if (isBlank(c)) return false;
    var n = normalizeText(c);
    return (n.indexOf(' ') !== -1 || n.indexOf('_') !== -1) && text.indexOf(n) !== -1;
  })).map(function (c) { return 'The ticket or account details contain the answer choice "' + c + '" word for word.'; });
}

// ---- src/drills/registry.js
// Drill type registry. To add a drill, write a type definition with the same shape as
// APPROVE_DENY_TYPE (ids, defaults, sourceKeywords, formInstructions, questions,
// promptGuidance, outputSchema, buildAnswerKey) and list it here.
//
// Resolved lazily (inside a function) so Apps Script file load order never matters.

function getDrillTypes() {
  return [APPROVE_DENY_TYPE, TRIAGE_TYPE];
}

function getDrillType(type) {
  var def = getDrillTypes().filter(function (d) { return d.type === type; })[0];
  if (!def) throw ServiceError('UNKNOWN_DRILL_TYPE', 'Unknown drill type: ' + type);
  return def;
}

function listDrillTypeSummaries() {
  return getDrillTypes().map(function (d) {
    return {
      type: d.type, name: d.name, description: d.description, cadence: d.cadence,
      defaults: d.defaults, requiresCatalog: !!d.requiresCatalog, categories: d.categories || null,
      audiences: d.audiences || ['CUSTOMER']
    };
  });
}

var DIFFICULTY_GUIDANCE = {
  EASY: 'One clear deciding fact, few distractors.',
  MEDIUM: 'Two or three relevant facts, one distractor, one mildly conflicting signal.',
  HARD: 'Several account facts, prior agent actions and history, two or more distractors and a genuinely conflicting signal. The deciding fact is easy to overlook.'
};

var GAP_TAGS = [
  'INCORRECT_DECISION', 'INCORRECT_PROCESS', 'INCORRECT_TAG', 'INCORRECT_CHECKLIST',
  'MISSING_ACCOUNT_DETAIL', 'WEAK_REASONING', 'POLICY_MISREAD', 'OTHER'
];

// ---- src/core/generator.js
// Scenario generation: prompt construction and conversion of model output into a
// structured scenario with trainee/trainer split and review flags.
//
// llm interface: await llm.generateJson({ system, user, schema }) -> parsed object.

var GENERATOR_SYSTEM_PROMPT = [
  'You write customer-service training tickets for Homeaglow Care trainees, plus the trainer answer key.',
  'Use ONLY the <source> sections provided: Knowledge Library sections (official policy) and CSQ Slack messages (recent clarifications from leads). Do not use outside knowledge of how retention or refunds "usually" work.',
  'For every claim in the answer key add a citation: the source id and a short quote copied word for word from that source. Never paraphrase inside a quote.',
  'If the Knowledge Library and a Slack message disagree, follow the more recent clarification and describe the disagreement in sourceConflict; otherwise leave sourceConflict empty.',
  'If the sources do not clearly give the correct answer, write a different ticket that they do cover. If none is possible, set insufficientSource to true and say what is missing in insufficientReason. Never invent a policy.',
  'STYLE. Write like the real sender (a customer or a cleaner partner, as the prompt says): short, plain, everyday words (easy for a new hire to read). Title: 3 to 6 words. Ticket: 2 to 4 short sentences, under 80 words. No long backstory.',
  'Account details: 3 to 6 short label/value pairs, each value a few words (for example "Plan: FCF $19/month", "Last cleaning: Sep 22, 2026").',
  'ACCOUNT DETAILS MUST BE REAL FIELDS that agents actually see in Homeaglow\'s CRM or CP tools (the prompt lists the usual ones). Never invent fields such as app version, device, browser, operating system or internal codes. You may include at most one real field that does not change the answer.',
  'Do not copy a process, tag or checklist name into the ticket or account details. Show the facts that point to it (status, dates, what happened) the way the tools show them.',
  'DATES. Use current dates. Every date must be within the last 12 months of today (scheduled cleanings may be up to 2 months ahead). Write dates like "Sep 22, 2026".',
  'Do not state the answer, name the policy, or hint at "the correct action" in the ticket or account details.',
  'Slack messages describe real cases. Use them to learn the rule, never copy them: invent new names, amounts, dates and IDs for every ticket.',
  'Trainer-only fields: rationale in 1 to 2 short sentences; at most 2 common mistakes, each one short line; coaching note in one sentence.'
].join('\n');

function buildGenerationPrompt(typeDef, ctx) {
  var parts = [];
  parts.push('Today is ' + humanDate(ctx.today) + '.');
  parts.push('AGENT SIDE: ' + getAudience(ctx.audience).short + '. The ticket is from ' + getAudience(ctx.audience).sender + '.');
  parts.push('Account detail fields agents see on this side: ' + getAudience(ctx.audience).fields.join(', ') + '.');
  if (ctx.topic) parts.push('TOPIC: every ticket in this drill must be about "' + ctx.topic + '". Use the sources about this topic.');
  parts.push(typeDef.promptGuidance(ctx));
  parts.push('Difficulty: ' + ctx.difficulty + ' — ' + (DIFFICULTY_GUIDANCE[ctx.difficulty] || ''));
  if (ctx.avoid && ctx.avoid.length) {
    parts.push('Already used in this drill (write something clearly different):\n' + ctx.avoid.map(function (t) { return '- ' + t; }).join('\n'));
  }
  if (ctx.trainerHint) parts.push('Trainer request for this scenario: ' + ctx.trainerHint);
  parts.push('Sources:\n\n' + formatSectionsForPrompt(ctx.sections));
  return { system: GENERATOR_SYSTEM_PROMPT, user: parts.join('\n\n') };
}

// Rules a draft must meet; any problem triggers one automatic rewrite.
function styleProblems(typeDef, ctx, out) {
  var problems = ctx.today ? checkReadability(out, ctx.today) : [];
  if (typeDef.styleCheck) problems = problems.concat(typeDef.styleCheck(out, ctx));
  return problems;
}

async function generateScenarioContent(typeDef, ctx, llm) {
  if (!ctx.sections || !ctx.sections.length) {
    throw ServiceError('NO_SOURCE_MATERIAL', 'No approved source sections matched this drill type. Import or refresh sources first.');
  }
  var prompt = buildGenerationPrompt(typeDef, ctx);
  var schema = typeDef.outputSchema(ctx);
  var output = await llm.generateJson({ system: prompt.system, user: prompt.user, schema: schema });
  var problems = checkJsonAgainstSchema(output, schema);
  if (problems.length) {
    throw ServiceError('BAD_MODEL_OUTPUT', 'Generated scenario did not match the expected structure: ' + problems.slice(0, 5).join('; '));
  }
  // One automatic rewrite when the ticket is too wordy or its dates are stale.
  var style = styleProblems(typeDef, ctx, output);
  if (style.length) {
    var retry = await llm.generateJson({
      system: prompt.system,
      user: prompt.user + '\n\nYour previous answer broke these rules. Fix them and keep the same answer key:\n- ' + style.join('\n- ') +
        '\n\nPrevious answer:\n' + JSON.stringify(output),
      schema: schema
    });
    if (!checkJsonAgainstSchema(retry, schema).length) output = retry;
  }
  return output;
}

// Turn model output (or a blank manual scenario when output is null) into the
// trainee and trainer parts plus review flags.
function buildScenarioParts(typeDef, ctx, output) {
  var questionsWithScoring = typeDef.questions(ctx);
  var flags = [];
  var out = output || {
    insufficientSource: false, insufficientReason: '', title: '', ticket: '', accountDetails: [],
    rationale: '', commonMistakes: [], coachingNotes: '', citations: []
  };

  if (!isBlank(out.sourceConflict)) {
    flags.push(makeFlag('SOURCE_CONFLICT', 'The Library and a Slack clarification disagree: ' + out.sourceConflict, false));
  }
  var styleLeft = output ? styleProblems(typeDef, ctx, out) : [];
  if (styleLeft.length) flags.push(makeFlag('STYLE', styleLeft.join(' '), false));
  if (out.insufficientSource) {
    flags.push(makeFlag('INSUFFICIENT_SOURCE', 'Generator reported the sources do not support an answer: ' + (out.insufficientReason || '(no reason given)'), true));
  }

  var key = typeDef.buildAnswerKey(out, ctx, questionsWithScoring);
  flags = flags.concat(key.flags || []);
  var finalQuestions = key.questions || questionsWithScoring;

  var verifiedSources = verifyCitations(out.citations || [], ctx.sections || []);
  if (key.catalogSources) verifiedSources = verifiedSources.concat(deepClone(key.catalogSources));
  if (output) {
    flags = flags.concat(sourceFlags(verifiedSources, (ctx.sections || []).length > 0));
  } else {
    flags.push(makeFlag('MANUAL_ENTRY', 'Manually written scenario. Add the source reference for the answer key, then resolve this flag.', true));
  }

  var scoring = {};
  finalQuestions.forEach(function (q) { scoring[q.key] = deepClone(q.scoring); });

  var trainee = {
    title: out.title || '',
    scenario: out.ticket || '',
    accountDetails: deepClone(out.accountDetails || []),
    traineeInstructions: '',
    questions: finalQuestions.map(function (q) {
      return { key: q.key, prompt: q.prompt, type: q.type, choices: deepClone(q.choices || []), required: q.required !== false, helpText: q.helpText || '' };
    })
  };

  var trainer = {
    correctAnswer: key.correctAnswer || {},
    correctDecision: key.correctDecision || '',
    requiredAccountDetail: key.requiredAccountDetail || '',
    rationale: out.rationale || '',
    sources: verifiedSources,
    scoring: scoring,
    scoringCriteria: finalQuestions.map(function (q) { return q.prompt + ' — ' + (q.scoring.mode === 'AUTO' ? 'auto' : 'manual') + ', ' + q.scoring.points + ' pt: ' + q.scoring.criteria; }),
    commonMistakes: deepClone(out.commonMistakes || []),
    coachingNotes: out.coachingNotes || '',
    trainerNotes: '',
    catalogId: key.catalogId || null
  };

  return { trainee: trainee, trainer: trainer, category: key.category || ctx.category || null, flags: flags };
}

// Re-derive the flags that depend on current content. Source flags that a trainer
// resolved stay resolved; content flags are recomputed and cannot be waived.
function recomputeContentFlags(scenario) {
  var keep = (scenario.reviewFlags || []).filter(function (f) {
    return ['ANSWER_LEAK', 'INVALID_SCENARIO'].indexOf(f.code) === -1;
  });
  var leaks = findTraineeLeaks(toTraineeVersion(scenario), scenario.trainer);
  if (leaks.length) keep.push(makeFlag('ANSWER_LEAK', leaks.join(' '), true, false));
  var errors = validateScenario(scenario);
  var typeDef = scenario.drillType ? getDrillType(scenario.drillType) : null;
  if (typeDef && typeDef.validate) errors = errors.concat(typeDef.validate(scenario));
  if (errors.length) keep.push(makeFlag('INVALID_SCENARIO', errors.join(' '), true, false));
  scenario.reviewFlags = keep;
  return scenario;
}

async function proposeCatalogEntries(typeDef, sections, llm, audienceId) {
  if (!sections.length) throw ServiceError('NO_SOURCE_MATERIAL', 'No source sections matched the triage keywords. Refresh sources first.');
  var schema = typeDef.catalogOutputSchema(audienceId);
  var out = await llm.generateJson({
    system: GENERATOR_SYSTEM_PROMPT,
    user: typeDef.catalogPromptGuidance(audienceId) + '\n\nApproved sources:\n\n' + formatSectionsForPrompt(sections),
    schema: schema
  });
  var problems = checkJsonAgainstSchema(out, schema);
  if (problems.length) throw ServiceError('BAD_MODEL_OUTPUT', 'Catalog output did not match the expected structure: ' + problems.slice(0, 5).join('; '));
  return (out.entries || []).filter(function (e) { return !isReferenceEntry(e); }).map(function (e) {
    var sources = verifyCitations(e.citations || [], sections);
    var verified = sources.some(function (s) { return s.verified; });
    return {
      name: shortProcessName(e.name), sourceTitle: e.sourceTitle || e.name, tag: e.tag || '', checklist: e.checklist || '', category: e.category, whenToUse: e.whenToUse || '',
      sources: sources,
      flags: verified ? [] : [makeFlag('UNVERIFIED_SOURCE', 'No cited quote was found in the sources.', true)]
    };
  });
}

// ---- src/core/formSpec.js
// Builds a provider-neutral description of the Google Form from the APPROVED scenarios.
// Only toTraineeVersion() output is read here, and the finished spec is scanned for
// trainer-only text before anything is sent to Google.

var IDENTITY_ITEM_KEY = '_trainee/name';
var IDENTITY_ITEM_TITLE = 'Your full name';

function formMarker(drillId) {
  return 'Drill ID: ' + drillId;
}

function renderTicketText(t) {
  var lines = [];
  if (!isBlank(t.title)) lines.push(t.title, '');
  lines.push('Customer ticket:', t.scenario || '');
  if (t.accountDetails && t.accountDetails.length) {
    lines.push('', 'Account details:');
    t.accountDetails.forEach(function (d) { lines.push('• ' + d.label + ': ' + d.value); });
  }
  if (!isBlank(t.traineeInstructions)) lines.push('', t.traineeInstructions);
  return lines.join('\n');
}

function buildFormSpec(drill, scenarios, typeDef, options) {
  options = options || {};
  var active = activeScenarios(scenarios);
  var items = [{
    kind: 'QUESTION', key: IDENTITY_ITEM_KEY, scenarioId: null, questionKey: null,
    title: IDENTITY_ITEM_TITLE, type: 'SHORT_TEXT', choices: [], required: true, helpText: ''
  }];
  active.forEach(function (s, si) {
    var t = toTraineeVersion(s);
    items.push({
      kind: 'SECTION', key: s.scenarioId + '/_section', scenarioId: s.scenarioId, questionKey: null,
      title: typeDef.name + ' — Scenario ' + (si + 1) + ' (' + s.scenarioId + ')',
      helpText: renderTicketText(t)
    });
    t.questions.forEach(function (q, qi) {
      items.push({
        kind: 'QUESTION', key: s.scenarioId + '/' + q.key, scenarioId: s.scenarioId, questionKey: q.key,
        title: questionTag(s.scenarioId, qi) + ' — ' + q.prompt,
        type: q.type, choices: q.choices || [], required: q.required !== false, helpText: q.helpText || ''
      });
    });
  });

  var spec = {
    drillId: drill.drillId,
    title: (drill.title || typeDef.name) + ' — ' + drill.drillId,
    description: typeDef.formInstructions(drill) + '\n\n' + formMarker(drill.drillId),
    marker: formMarker(drill.drillId),
    items: items,
    settings: {
      collectVerifiedEmail: options.collectVerifiedEmail !== false,
      limitOneResponsePerUser: options.collectVerifiedEmail !== false,
      allowResponseEdits: false,
      publishSummary: false,
      isQuiz: false,
      confirmationMessage: 'Thanks — your answers were submitted. Your trainer will review them with you.'
    }
  };
  assertFormSpecSafe(spec, active);
  spec.specHash = hashObject(spec.items);
  return spec;
}

function assertFormSpecSafe(spec, scenarios) {
  var text = normalizeText(collectStrings([spec.title, spec.description, spec.items]).join(' \n '));
  var leaks = [];
  scenarios.forEach(function (s) {
    trainerOnlyStrings(s.trainer).forEach(function (str) {
      if (text.indexOf(str) !== -1) leaks.push(s.scenarioId + ': "' + str.slice(0, 60) + '…"');
    });
  });
  if (leaks.length) {
    throw ServiceError('ANSWER_LEAK', 'Form content contains trainer-only text; fix the scenarios before creating the form. ' + leaks.join('; '));
  }
}

// Order of question keys per scenario, used to resolve "AD-001 · Q2" style tags.
function questionKeysByScenario(scenarios) {
  var map = {};
  activeScenarios(scenarios).forEach(function (s) {
    map[s.scenarioId] = (s.trainee.questions || []).map(function (q) { return q.key; });
  });
  return map;
}

// ---- src/core/responseMapper.js
// Maps raw form submissions onto drill / scenario / question / trainee.
//
// Raw response: { responseId, submittedAt, respondentEmail, answers: [{ itemId, title, value }] }
//
// Mapping order for each answer:
//   1. Form item ID (stable for the life of the form) via the stored FormItems map.
//   2. The "AD-001 · Q2" tag at the start of the question title / sheet header.
//   3. Exact identity-question title.
// Column positions are never used.

function mapResponses(drillId, rawResponses, formItems, keysByScenario) {
  var byItemId = {};
  formItems.forEach(function (fi) { if (fi.itemId) byItemId[String(fi.itemId)] = fi; });

  var rows = [];
  var unmapped = [];
  var responses = [];

  rawResponses.forEach(function (r) {
    var name = null;
    var mappedAnswers = [];
    (r.answers || []).forEach(function (a) {
      var target = resolveTarget(a, byItemId, keysByScenario);
      if (!target) {
        unmapped.push({ responseId: r.responseId, title: a.title, itemId: a.itemId || null });
        return;
      }
      if (target.key === IDENTITY_ITEM_KEY) {
        name = Array.isArray(a.value) ? a.value.join(' ') : String(a.value || '');
        return;
      }
      mappedAnswers.push({ scenarioId: target.scenarioId, questionKey: target.questionKey, value: a.value });
    });

    var traineeId = traineeIdFor(r.respondentEmail, name);
    responses.push({ responseId: r.responseId, traineeId: traineeId, traineeName: name, traineeEmail: r.respondentEmail || null, submittedAt: r.submittedAt });
    mappedAnswers.forEach(function (m) {
      var answer = Array.isArray(m.value) ? m.value.slice() : (m.value == null ? '' : String(m.value));
      rows.push({
        answerId: makeAnswerId(drillId, r.responseId, m.scenarioId, m.questionKey),
        drillId: drillId,
        responseId: r.responseId,
        scenarioId: m.scenarioId,
        scenarioUid: makeScenarioUid(drillId, m.scenarioId),
        questionKey: m.questionKey,
        traineeId: traineeId,
        traineeName: name,
        traineeEmail: r.respondentEmail || null,
        submittedAt: r.submittedAt,
        answer: answer,
        answerHash: hashObject(answer)
      });
    });
  });

  return { rows: rows, unmapped: unmapped, responses: responses };
}

function resolveTarget(answer, byItemId, keysByScenario) {
  if (answer.itemId != null && byItemId[String(answer.itemId)]) {
    var fi = byItemId[String(answer.itemId)];
    return { key: fi.key, scenarioId: fi.scenarioId, questionKey: fi.questionKey };
  }
  var tag = parseQuestionTag(answer.title);
  if (tag && keysByScenario[tag.scenarioId]) {
    var qk = keysByScenario[tag.scenarioId][tag.questionNumber - 1];
    if (qk) return { key: tag.scenarioId + '/' + qk, scenarioId: tag.scenarioId, questionKey: qk };
  }
  if (normalizeText(answer.title) === normalizeText(IDENTITY_ITEM_TITLE)) {
    return { key: IDENTITY_ITEM_KEY, scenarioId: null, questionKey: null };
  }
  return null;
}

// Fallback reader for the linked response spreadsheet. Headers are matched by name, so
// reordered or inserted columns do not break mapping.
function rawResponsesFromSheet(headers, rows) {
  var norm = headers.map(normalizeText);
  var tsCol = norm.indexOf('timestamp');
  var emailCol = norm.indexOf('email address');
  return rows.filter(function (row) {
    return row.some(function (c) { return !isBlank(c); });
  }).map(function (row) {
    var ts = tsCol === -1 ? '' : row[tsCol];
    var email = emailCol === -1 ? '' : row[emailCol];
    var tsIso = ts instanceof Date ? ts.toISOString() : String(ts);
    var answers = [];
    headers.forEach(function (h, i) {
      if (i === tsCol || i === emailCol) return;
      answers.push({ itemId: null, title: h, value: row[i] });
    });
    return {
      responseId: 'sheet:' + hashString(tsIso + '|' + email + '|' + JSON.stringify(row)),
      submittedAt: tsIso,
      respondentEmail: email || null,
      answers: answers
    };
  });
}

// ---- src/core/scoring.js
// Scoring. Objective questions are auto-scored; subjective ones wait for a trainer.
// The auto score and the trainer-approved final score are stored separately.

// Choice answers can arrive as arrays (Forms API) or as ", "-joined strings (sheet).
// Match against the known choices instead of splitting on commas, since a choice may
// itself contain a comma.
function normalizeChoiceAnswer(answer, choices) {
  if (Array.isArray(answer)) return answer.map(function (a) { return String(a).trim(); }).filter(Boolean);
  var s = String(answer == null ? '' : answer);
  if (isBlank(s)) return [];
  // Longest choices first, consuming matched text, so "Refund" is not also found inside
  // "Voucher refund".
  var rest = s;
  var picked = [];
  (choices || []).slice().sort(function (a, b) { return b.length - a.length; }).forEach(function (c) {
    var idx = rest.indexOf(c);
    if (idx !== -1) {
      picked.push(c);
      rest = rest.slice(0, idx) + '\u0000' + rest.slice(idx + c.length);
    }
  });
  return picked.length ? picked : [s.trim()];
}

function setsEqual(a, b) {
  var na = uniq(a.map(normalizeText)).sort();
  var nb = uniq(b.map(normalizeText)).sort();
  return na.length === nb.length && na.every(function (x, i) { return x === nb[i]; });
}

// Rough overlap between the trainee's text and the expected account detail. Shown to the
// trainer as a hint only; it never sets a score.
function keywordAssist(expected, answer) {
  var stop = { the: 1, a: 1, an: 1, and: 1, or: 1, of: 1, to: 1, in: 1, on: 1, for: 1, is: 1, was: 1, has: 1, with: 1, their: 1, they: 1 };
  var terms = uniq(normalizeText(expected).split(/[^a-z0-9$%./-]+/).filter(function (w) { return w.length > 1 && !stop[w]; }));
  if (!terms.length) return { overlap: null, matchedTerms: [] };
  var ans = normalizeText(Array.isArray(answer) ? answer.join(' ') : answer);
  var matched = terms.filter(function (t) { return ans.indexOf(t) !== -1; });
  return { overlap: Math.round((matched.length / terms.length) * 100) / 100, matchedTerms: matched };
}

function computeAutoScore(rule, expected, answer, choices) {
  rule = rule || { mode: 'MANUAL', points: 0 };
  if (rule.mode !== 'AUTO') {
    return { mode: 'MANUAL', maxPoints: rule.points, autoScore: null, autoCorrect: null, assist: keywordAssist(asArray(expected).join(' '), answer) };
  }
  var given = normalizeChoiceAnswer(answer, choices);
  var exp = asArray(expected);
  var correct = rule.method === 'EXACT_SET' ? setsEqual(given, exp) : (given.length === 1 && exp.length === 1 && normalizeText(given[0]) === normalizeText(exp[0]));
  return { mode: 'AUTO', maxPoints: rule.points, autoScore: correct ? rule.points : 0, autoCorrect: correct, assist: null, normalizedAnswer: given };
}

// Build or refresh the score row for an answer. Trainer fields (finalScore, gapTags,
// coachingNote) are never overwritten here.
function scoreAnswerRow(answerRow, scenario, existing) {
  var q = (scenario.trainee.questions || []).filter(function (x) { return x.key === answerRow.questionKey; })[0];
  var rule = (scenario.trainer.scoring || {})[answerRow.questionKey];
  var expected = (scenario.trainer.correctAnswer || {})[answerRow.questionKey];
  var auto = computeAutoScore(rule, expected, answerRow.answer, q ? q.choices : []);
  var expectedHash = hashObject([expected, rule]);
  var row = existing ? deepClone(existing) : {
    answerId: answerRow.answerId, drillId: answerRow.drillId, scenarioId: answerRow.scenarioId,
    questionKey: answerRow.questionKey, traineeId: answerRow.traineeId,
    finalScore: null, finalSetBy: null, finalSetAt: null, gapTags: [], coachingNote: '', reviewStatus: null
  };
  var changed = existing && (existing.answerHash !== answerRow.answerHash || existing.expectedHash !== expectedHash);
  row.mode = auto.mode;
  row.maxPoints = auto.maxPoints;
  row.autoScore = auto.autoScore;
  row.autoCorrect = auto.autoCorrect;
  row.assist = auto.assist;
  row.normalizedAnswer = auto.normalizedAnswer || null;
  row.answerHash = answerRow.answerHash;
  row.expectedHash = expectedHash;
  row.expectedSnapshot = deepClone(expected == null ? null : expected);
  if (auto.mode === 'AUTO' && auto.autoCorrect === false && rule && rule.gapTagOnWrong) {
    row.autoGapTag = rule.gapTagOnWrong;
  } else {
    row.autoGapTag = null;
  }
  if (row.finalScore != null) {
    row.reviewStatus = changed ? 'NEEDS_REVIEW' : 'REVIEWED';
    row.staleSinceReview = !!changed || !!row.staleSinceReview;
  } else {
    row.reviewStatus = auto.mode === 'AUTO' ? 'AUTO_SCORED' : 'NEEDS_REVIEW';
  }
  return row;
}

function applyTrainerScore(row, input, actor, nowIso) {
  if (input.finalScore != null) {
    var n = Number(input.finalScore);
    if (isNaN(n) || n < 0 || n > row.maxPoints) {
      throw ServiceError('INVALID_SCORE', 'Score must be between 0 and ' + row.maxPoints + '.');
    }
    row.finalScore = n;
    row.finalSetBy = actor;
    row.finalSetAt = nowIso;
    row.reviewStatus = 'REVIEWED';
    row.staleSinceReview = false;
  }
  if (input.gapTags) row.gapTags = input.gapTags.filter(function (t) { return GAP_TAGS.indexOf(t) !== -1; });
  if (input.coachingNote != null) row.coachingNote = String(input.coachingNote);
  return row;
}

function effectiveScore(row) {
  if (row.finalScore != null) return row.finalScore;
  return row.autoScore;
}

function summarizeScores(rows) {
  var earned = 0, possible = 0, pending = 0;
  rows.forEach(function (r) {
    possible += r.maxPoints || 0;
    var e = effectiveScore(r);
    if (e == null) pending++;
    else earned += e;
  });
  return { earned: earned, possible: possible, pendingReview: pending, pct: possible ? Math.round((earned / possible) * 1000) / 10 : null };
}

// ---- src/core/coaching.js
// Cohort and trainee performance analysis over scored answers.

function buildCoachingReport(drills, answers, scores) {
  var drillById = {};
  drills.forEach(function (d) { drillById[d.drillId] = d; });
  var answerById = {};
  answers.forEach(function (a) { answerById[a.answerId] = a; });

  var trainees = {};
  var gapCounts = {};
  var questionStats = {};
  var wrongChoices = {};
  var drillTrend = {};

  scores.forEach(function (row) {
    var answer = answerById[row.answerId] || {};
    var drill = drillById[row.drillId] || {};
    var t = trainees[row.traineeId] = trainees[row.traineeId] || {
      traineeId: row.traineeId, name: answer.traineeName || null, email: answer.traineeEmail || null,
      drills: {}, rows: [], gaps: {}
    };
    t.rows.push(row);
    t.drills[row.drillId] = true;

    var tags = uniq((row.gapTags || []).concat(row.autoGapTag && row.finalScore == null ? [row.autoGapTag] : []));
    if (row.finalScore != null && row.autoGapTag && row.finalScore < row.maxPoints && tags.indexOf(row.autoGapTag) === -1) tags.push(row.autoGapTag);
    tags.forEach(function (g) {
      gapCounts[g] = (gapCounts[g] || 0) + 1;
      t.gaps[g] = (t.gaps[g] || 0) + 1;
    });

    var qk = (drill.drillType || '?') + ':' + row.questionKey;
    var qs = questionStats[qk] = questionStats[qk] || { drillType: drill.drillType, questionKey: row.questionKey, answered: 0, correct: 0, pending: 0 };
    qs.answered++;
    var eff = effectiveScore(row);
    if (eff == null) qs.pending++;
    else if (eff >= row.maxPoints) qs.correct++;

    if (row.mode === 'AUTO' && row.autoCorrect === false) {
      var key = qk + '|' + asArray(row.expectedSnapshot).join(' + ') + '|' + asArray(row.normalizedAnswer).join(' + ');
      wrongChoices[key] = wrongChoices[key] || {
        drillType: drill.drillType, questionKey: row.questionKey,
        expected: asArray(row.expectedSnapshot).join(' + '), given: asArray(row.normalizedAnswer).join(' + ') || '(blank)',
        count: 0, scenarioIds: []
      };
      wrongChoices[key].count++;
      wrongChoices[key].scenarioIds = uniq(wrongChoices[key].scenarioIds.concat([row.scenarioId]));
    }

    var dt = drillTrend[row.drillId] = drillTrend[row.drillId] || { drillId: row.drillId, drillType: drill.drillType, createdAt: drill.createdAt, rows: [] };
    dt.rows.push(row);
  });

  var traineeList = Object.keys(trainees).map(function (id) {
    var t = trainees[id];
    var s = summarizeScores(t.rows);
    return {
      traineeId: id, name: t.name, email: t.email, drills: Object.keys(t.drills).length,
      earned: s.earned, possible: s.possible, pct: s.pct, pendingReview: s.pendingReview,
      topGaps: Object.keys(t.gaps).map(function (g) { return { tag: g, count: t.gaps[g] }; }).sort(function (a, b) { return b.count - a.count; })
    };
  }).sort(function (a, b) { return (a.pct == null ? 101 : a.pct) - (b.pct == null ? 101 : b.pct); });

  return {
    trainees: traineeList,
